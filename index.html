<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="theme-color" content="#FAF9F6" />
		<title>Typelapse: beautiful code animations</title>
		<meta
			name="description"
			content="Typelapse turns code changes into polished, token-level videos for every feed. Import a pull request, refine the motion, and export exactly what you preview."
		/>
		<!-- OpenGraph -->
		<meta property="og:title" content="Typelapse: your code, in motion" />
		<meta
			property="og:description"
			content="Turn a pull request, diff or snippet into a polished code video. Refine the motion and export exactly what you preview."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Typelapse" />
		<!-- Rendered by Typelapse itself (1200×630 frame of the self-demo). Make absolute at deploy. -->
		<meta property="og:image" content="/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="/og.png" />
		<meta name="twitter:title" content="Typelapse: your code, in motion" />
		<meta
			name="twitter:description"
			content="Turn a pull request, diff or snippet into a polished code video. Refine the motion and export exactly what you preview."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Two families, not four. Geist carries every sans role; Ioskeley Mono
		     (self-hosted, below) carries every mono role. -->
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link rel="preload" href="/fonts/IoskeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
