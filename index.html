<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover: the pages paint under the notch and pad their content
		     back out with env(safe-area-inset-*). resizes-content: Android's keyboard
		     shrinks the layout like iOS does, so the phone sheet's editor stays above it. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<!-- The .ico is first and sized 32x32 so legacy clients, and anything that asks for
		     /favicon.ico anyway, find it; sizes="any" lets a browser that reads SVG pick the SVG. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
		<!-- iOS takes no SVG icon: the favicon's mark again, as a 180px PNG on a full-bleed
		     square (iOS rounds the corners itself and paints transparency black). -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110" />
		<title>Typelapse: sharp code videos from a pull request</title>
		<!-- Paints the document in the theme the app will open in, before the bundle
		     runs: on / the landing's stored choice, elsewhere the studio's, and the OS
		     before either (use-landing-theme.ts and theme-mode.store.ts decide the
		     same way). A blocked storage throws on read; the OS still answers then. -->
		<script>
			try {
				var root = document.documentElement;
				var osDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				var landing = location.pathname === "/";
				var stored = null;
				try {
					stored = localStorage.getItem(landing ? "typelapse.landing-theme" : "typelapse.studio-theme");
				} catch (error) {}
				var dark = stored === "dark" || (stored !== "light" && osDark);
				// The two pre-bundle screens below read this one marker, on every route: the
				// stored choice beats the OS, as it does for the app, and without the script
				// (no JavaScript) the media query in the style below answers for the OS.
				root.dataset.bootTheme = dark ? "dark" : "light";
				if (landing) {
					root.dataset.landingTheme = dark ? "dark" : "light";
				} else if (dark) {
					root.classList.add("dark");
				}
			} catch (error) {}
		</script>
		<!-- The two screens below that run before the app does (the noscript and the
		     failed boot) have none of the app's stylesheet to lean on, or have it and
		     meet Tailwind's preflight, which flattens a heading's weight and a
		     paragraph's margin to nothing. So they are drawn here, in the 404 family's
		     own material: Geist centred on the paper, a heading, an ash sentence, the
		     link a 44px target. The unlayered rules win over preflight's layer.
		     The theme is the marker the script above sets (the stored choice, then the
		     OS); a visitor without JavaScript has no marker and gets the OS from the
		     media query. The paper, ink and ash are app.css's, light and dark.
		     Each link is underlined, in the accent's own hue and chroma at the
		     lightness text needs (5.5:1 on the light paper, 7:1 on the dark one; the
		     accent itself reads 3.6:1 on paper and is for rings). -->
		<style>
			@font-face {
				font-family: "Geist";
				src: url(/fonts/Geist-latin.woff2) format("woff2");
				font-weight: 100 900;
				font-display: swap;
			}
			@font-face {
				font-family: "Geist Fallback";
				src: local("Arial"), local("ArialMT"), local("Liberation Sans");
				font-weight: 100 500;
				size-adjust: 101.77%;
				ascent-override: 98.75%;
				descent-override: 28.99%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: "Geist Fallback";
				src: local("Arial Bold"), local("Arial-BoldMT"), local("Liberation Sans Bold");
				font-weight: 600 900;
				size-adjust: 100.08%;
				ascent-override: 100.42%;
				descent-override: 29.48%;
				line-gap-override: 0%;
			}
			:root {
				--boot-paper: #faf9f6;
				--boot-ink: #1c1b19;
				--boot-ash: #6e6b64;
				color-scheme: light;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-boot-theme]) {
					--boot-paper: #121110;
					--boot-ink: #f5f3ef;
					--boot-ash: #a8a39a;
					color-scheme: dark;
				}
			}
			:root[data-boot-theme="dark"] {
				--boot-paper: #121110;
				--boot-ink: #f5f3ef;
				--boot-ash: #a8a39a;
				color-scheme: dark;
			}
			html {
				background: var(--boot-paper);
			}
			body {
				margin: 0;
			}
			.boot-screen {
				box-sizing: border-box;
				min-height: 100vh;
				min-height: 100dvh;
				margin: 0;
				padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
					max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 8px;
				background: var(--boot-paper);
				color: var(--boot-ash);
				font: 400 15px/1.6 "Geist", "Geist Fallback", ui-sans-serif, system-ui, sans-serif;
				text-align: center;
				text-wrap: pretty;
				-webkit-font-smoothing: antialiased;
			}
			.boot-screen[hidden] {
				display: none;
			}
			.boot-screen h1 {
				max-width: 24ch;
				margin: 0 0 4px;
				color: var(--boot-ink);
				font-size: 22px;
				font-weight: 600;
				line-height: 1.2;
				letter-spacing: -0.012em;
				text-wrap: balance;
			}
			.boot-screen p {
				max-width: 38ch;
				margin: 0;
			}
			.boot-link {
				--boot-link: #3b5bd4;
				/* 44px to a finger without moving a line: the padding is the target. */
				padding: 13px 6px;
				margin: -13px -6px;
				color: var(--boot-link);
				text-decoration: underline;
				text-decoration-thickness: 1px;
				text-underline-offset: 0.2em;
			}
			[data-landing-theme="dark"] .boot-link,
			[data-boot-theme="dark"] .boot-link,
			.dark .boot-link {
				--boot-link: #729bff;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-boot-theme]) .boot-link {
					--boot-link: #729bff;
				}
			}
			.boot-link:hover {
				text-decoration-thickness: 2px;
			}
			.boot-link:focus-visible {
				outline: 2px solid var(--boot-link);
				outline-offset: -2px;
				border-radius: 6px;
			}
		</style>
		<meta
			name="description"
			content="Make a code video in your browser from a pull request, as sharp as its preview. Text, images, video and audio share the same scenes."
		/>
		<!-- OpenGraph -->
		<meta property="og:title" content="Typelapse: code videos as sharp as their preview" />
		<meta
			property="og:description"
			content="Make a code video in your browser from a pull request, as sharp as its preview. Text, images, video and audio share the same scenes."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Typelapse" />
		<!-- Rendered by Typelapse itself (1200×630 frame of the self-demo). Root-relative here;
		     vite-plugin-absolute-og.ts puts it on TYPELAPSE_APP_URL at build time. -->
		<meta property="og:image" content="/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A code window on a purple and blue gradient, showing a function that captures code, morphs its steps and renders the video."
		/>
		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="/og.png" />
		<meta
			name="twitter:image:alt"
			content="A code window on a purple and blue gradient, showing a function that captures code, morphs its steps and renders the video."
		/>
		<meta name="twitter:title" content="Typelapse: code videos as sharp as their preview" />
		<meta
			name="twitter:description"
			content="Make a code video in your browser from a pull request, as sharp as its preview. Text, images, video and audio share the same scenes."
		/>
		<!-- Two UI families, not four: Geist carries every sans role, Ioskeley Mono every
		     mono role, both served from /fonts (the faces come from the font registry,
		     src/application/fonts/code-fonts.ts). Geist sets text on every route, so its
		     file is preloaded here; the others are named per route by the script below. -->
		<link rel="preload" href="/fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- What the address bar's route needs, asked for before the bundle runs.
		     / and /app set text in Ioskeley (the UI's mono) and JetBrains Mono (the
		     frame's code, which the font registry only installs once main.tsx runs, so
		     without a hint it arrives after everything else); the 404 sets text in
		     neither. /app also gets its own files: the studio is a lazy route, nothing
		     asks for its chunk until the entry bundle has run and React has rendered,
		     and the build wrote their hashed names into the JSON element above
		     (vite-plugin-studio-preload.ts). The tab is named here too, so it never
		     says "the landing" over the studio while the bundle loads; the studio takes
		     over the name once it mounts. -->
		<script>
			(function () {
				var path = location.pathname;
				var studio = /^\/app(\/|$)/.test(path);
				function hint(rel, href, as, type) {
					var link = document.createElement("link");
					link.rel = rel;
					link.href = href;
					if (as) {
						link.setAttribute("as", as);
					}
					if (type) {
						link.type = type;
					}
					if (as === "font" || as === "style") {
						link.crossOrigin = "";
					}
					document.head.appendChild(link);
				}
				if (path === "/" || studio) {
					hint("preload", "/fonts/IoskeleyMono-Regular.woff2", "font", "font/woff2");
					hint("preload", "/fonts/JetBrainsMono-latin.woff2", "font", "font/woff2");
				}
				if (studio) {
					document.title = "Studio · Typelapse";
					try {
						var list = document.getElementById("typelapse-studio-chunks");
						JSON.parse(list ? list.textContent : "[]").forEach(function (file) {
							if (/\.css$/.test(file)) {
								hint("preload", file, "style");
							} else {
								hint("modulepreload", file);
							}
						});
					} catch (error) {}
				}
			})();
		</script>
		<!-- If the entry bundle never arrives (a blocked or failed script, a connection
		     that gave up) the page would stay blank for good. The sentence inside #root
		     is revealed when the script errors, or after ten seconds with nothing
		     mounted; React replaces #root's content when it does mount, which is also
		     what removes the sentence. -->
		<script>
			(function () {
				function reveal() {
					var note = document.getElementById("boot-failed");
					if (note) {
						note.hidden = false;
					}
				}
				setTimeout(reveal, 10000);
				window.addEventListener(
					"error",
					function (event) {
						if (event.target && event.target.tagName === "SCRIPT") {
							reveal();
						}
					},
					true,
				);
			})();
		</script>
	</head>
	<body>
		<noscript>
			<main class="boot-screen">
				<h1>Typelapse: sharp code videos from a pull request</h1>
				<p>Make a code video in your browser from a pull request, as sharp as its preview. Text, images, video and audio share the same scenes.</p>
				<p>Typelapse draws and encodes the video in your browser, so it needs JavaScript. Turn it on, then <a class="boot-link" href="">reload this page</a>.</p>
			</main>
		</noscript>
		<div id="root">
			<p id="boot-failed" class="boot-screen" hidden>
				<span>Still loading. <a class="boot-link" href="">Reload</a> if this stays.</span>
			</p>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
