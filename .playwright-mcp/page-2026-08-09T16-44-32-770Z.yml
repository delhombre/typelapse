        - heading "How to prototype with AI" [level=2] [ref=f30e149]
      - paragraph [ref=f30e150]: "A good prototyping flow you build with your agent should do a few things:"
      - list [ref=f30e151]:
        - listitem [ref=f30e152]:
          - generic [ref=f30e153]:
            - text: It builds three to five genuinely different directions, that’s the whole idea of prototyping, trying
