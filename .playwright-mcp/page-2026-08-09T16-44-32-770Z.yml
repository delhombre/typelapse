      - heading "Prototyping interfaces" [level=1] [ref=f30e54]
      - paragraph [ref=f30e55]: Prototyping is an essential part of building a great interface because it allows you to actually touch and feel the interface, see how it feels in different states and scenarios and iterate on it until you find the perfect solution.
      - paragraph [ref=f30e56]: That’s why building actual variants of a flow or component is way better than drawing wireframes or mockups. You can experience the thing instead of just imagining how it would feel.
      - paragraph [ref=f30e57]: And don’t get me wrong, you should still explore design directions in a design tool, but your goal should be to move to a living interface as soon as possible. That’s where ideas get validated.
      - paragraph [ref=f30e58]: You can experience it yourself, what gives you a better idea of whether this UI works or not? A static wireframe, or a live interface?
