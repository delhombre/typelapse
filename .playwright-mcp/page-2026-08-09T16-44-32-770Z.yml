      - paragraph [ref=f30e88]:
        - text: Before AI, building out a few different options was often a
        - emphasis [ref=f30e89]: very
        - text: time-consuming process. A process that in some cases couldn’t be done to the extent you would want it to be, or maybe even not at all. Code was the expensive part.
      - paragraph [ref=f30e90]: But now that code is becoming cheaper to produce, you can to spend some tokens on prototyping to improve the outcome of your work.
      - paragraph [ref=f30e91]: However, just asking the agent to create a few different types of the sign up flow for example might not always be the best way to go. There are things you should do, and things you shouldn’t. This lesson is about how you should approach prototyping with AI.
      - link [ref=f30e92] [cursor=pointer]:
        - /url: "#when-should-you-actually-prototype?"
        - heading "When should you actually prototype?" [level=2] [ref=f30e93]
      - paragraph [ref=f30e94]: In the exploration phase of your project or feature.
      - paragraph [ref=f30e95]: That is when you have a rough description of what you want to build, but you are not sure of the exact details of how it should happen or how it should look.
      - paragraph [ref=f30e96]: You can then use that rough description to ask your agent for a few protoypes. You most likely have a few different ideas of what a flow should look like. Describe them to an agent and let it build them for you so you can see how they feel and compare them.
      - paragraph [ref=f30e97]: "Here’s how I would approach prototyping a new onboarding flow:"
