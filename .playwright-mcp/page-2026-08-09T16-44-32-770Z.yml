        - heading "Let people tweak the values" [level=2] [ref=f30e188]
      - paragraph [ref=f30e189]: In the latter stages of a prototype you want to get the details right.
      - paragraph [ref=f30e190]: Wheter it’s a drag interaction or a intro animation, it’s often something that needs fine-tuning and the way I like to do it is via control panels.
      - paragraph [ref=f30e191]:
        - text: By binding a variable like
        - code [ref=f30e192]: Offset X
        - text: to a slider you can immidiately try different variations of an interaction by simply dragging it. This shortens the feedback loop and allows you to iterate on the interaction much faster.
      - paragraph [ref=f30e193]:
        - text: This can be done pretty quickly with tools like
        - link "DialKit" [ref=f30e194] [cursor=pointer]:
          - /url: https://github.com/joshpuckett/dialkit
        - text: which supports binding variables to sliders, color pickers, or even spring and bezier curves.
      - paragraph [ref=f30e195]: "Here’s the dithered Linear logo we made a while back at Linear. Move your cursor over it, click it a few times, then open the controls and try different values:"
      - generic [ref=f30e197]:
