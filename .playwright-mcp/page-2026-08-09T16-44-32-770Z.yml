      - paragraph [ref=f30e200]:
        - text: "When I was building it, I intentionally shared a preview link with the controls so everyone can tweak them and try their own variations. That’s great advice in general:"
        - strong [ref=f30e201]: share as much as possible, as often as possible
        - text: with your team to get their feedback.
      - paragraph [ref=f30e202]: Instead of tens of slack messages, everyone can tweak the values themselves, and share the configuration with me if they end up with something they like. This way it’s also easier for people to participate, because you lower the barrier to entry, and it’s just fun to play with.
      - paragraph [ref=f30e203]: This was the main reason why people on X loved it so much. Because everyone on the team could contribute to the design process, it wasn’t just a back and forth between the designer and an engineer. Everyone on the team (that we thought was a good fit for giving feedback here) was able to participate.
