name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck client
        run: pnpm check-types

      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # vite build with Monaco bundled peaks near 4.5 GB of resident
          # memory; Node's default heap on a 7 GB runner sits below that and
          # the build died with "heap out of memory".
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

  e2e-smoke:
    name: E2E smoke
    # Beside the Quality gate, not after it: a red journey and a red unit test
    # are both worth knowing on the same push.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The export journeys check the downloaded files with ffprobe and ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke journeys
        env:
          # Playwright's webServer runs vite build first; see the Quality gate.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm e2e:smoke

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ github.run_attempt }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 14

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisories are reported but never block a merge: a fresh CVE in a
      # transitive dependency is not a reason to freeze an unrelated PR.
      - name: Audit
        run: pnpm audit --audit-level moderate || true
