name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    # The gate (about 9 minutes) and the smoke journeys it now holds (about 2.5
    # on top of the shared build).
    timeout-minutes: 25

    # The PostgreSQL the contract tests run against, the nightly hosted job's
    # service. It lives in this job and not in a job of its own because the
    # ruleset requires this check by name: a second job could fail without
    # blocking a merge, and a Quality gate that waited on it would be skipped
    # when it failed, which GitHub reports as a pass.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: typelapse
          POSTGRES_DB: typelapse
        ports:
          - 54381:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d typelapse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # What the paths filter below reads: the pull request's file list, through
    # the API.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      hosted: ${{ steps.changes.outputs.hosted }}

    steps:
      - uses: actions/checkout@v7

      # Which pull requests can change what the hosted journeys see. A step of
      # this job and not a job of its own (#340): the job cost a whole billed
      # minute to run a 3 second step. Not a `paths:` filter on the workflow
      # either: that would skip the whole of CI on a landing-only pull request,
      # and the Quality gate must report on every pull request because the
      # ruleset requires it by name.
      #
      # The server imports most of src/ and the journeys drive the studio, so the
      # filter is everything under src/ except the landing page, plus the server, the
      # CLI the Action runs, the harness and the build inputs. Two steps because
      # `every` (src/** and not landing) and `some` (any of the rest) cannot share a
      # list: a lone negated pattern would match every file that is not the landing.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: src
        with:
          predicate-quantifier: every
          filters: |
            src:
              - 'src/**'
              - '!src/presentation/landing/**'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: rest
        with:
          filters: |
            rest:
              - 'server/**'
              - 'cli/**'
              - 'scripts/**'
              - 'action.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'playwright.config.ts'
              - 'tests/e2e/hosted/**'
              - 'tests/e2e/support/**'
              - 'tests/e2e/mobile-shell.spec.ts'
              - 'tests/support/fake-polar.ts'
              - '.github/workflows/hosted-e2e.yml'
              - '.github/workflows/ci.yml'

      # Two filters cannot make one output, so this step does.
      - name: What runs after the gate
        id: changes
        env:
          SRC: ${{ steps.src.outputs.src }}
          REST: ${{ steps.rest.outputs.rest }}
        run: |
          if [ "$SRC" = true ] || [ "$REST" = true ]; then
            echo "hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "hosted=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck client
        run: pnpm check-types

      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test

      # Vitest, tsc and vite build all passed while every Remotion render on
      # main failed ("Can't resolve '@/...'": Remotion's webpack does not know
      # the alias; #227, found by #236). Only a render sees that. It is a step
      # of this job, not a job of its own, for the reason the services block
      # gives: the ruleset requires this check by name. The Render PR workflow
      # cannot stand in for it: it is a demo that stays green on a failed render.
      # ubuntu-latest ships the browser's libraries; Remotion downloads its
      # headless Chrome on the first render. The last line printed is ffprobe's
      # summary of the clip.
      - name: Remember Remotion's browser
        id: remotion
        run: echo "version=$(node -p "require('@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"

      # Same cache as action.yml: Remotion downloads its headless Chrome (about
      # 100 MB) into node_modules/.remotion, and a failed download would turn
      # this required check red for a reason that is not the code.
      - uses: actions/cache@v6
        with:
          path: node_modules/.remotion
          key: typelapse-remotion-${{ runner.os }}-${{ runner.arch }}-${{ steps.remotion.outputs.version }}

      - name: Render a clip through Remotion
        run: pnpm render:smoke

      # Every tests/**/*.contract.test.ts, found by its name so a new one runs
      # with no line added here. They skip when the variable is unset, which is
      # why only this step sets it: the Test step above and a laptop skip them.
      # The migrations are applied once by tests/global-setup.ts before any
      # contract file starts, so no migrate line is needed here (a second one
      # would only repeat what the run does first). Left to the files, each
      # applied them on its own, and two that met an empty database together
      # failed on the same CREATE TABLE.
      - name: Contract tests (PostgreSQL)
        env:
          TYPELAPSE_TEST_DATABASE_URL: postgres://postgres:typelapse@127.0.0.1:54381/typelapse
        run: pnpm exec vitest run .contract.test.

      - name: Build
        env:
          # vite build with Monaco bundled peaks near 4.5 GB of resident
          # memory; Node's default heap on a 7 GB runner sits below that and
          # the build died with "heap out of memory".
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      # The smoke journeys, folded in from a job of their own (#340): that job
      # repeated checkout, install and a second vite build (about 2.5 billed
      # minutes of the 4.9) to reach the same dist. They are not a required
      # check by name, so folding them here changes what blocks a merge in one
      # way only: a red journey now also turns "Quality gate" red, and one that
      # follows a red unit test no longer runs on that push (fix the first, the
      # second shows on the next).
      # playwright.config.ts builds into a temp dir unless told otherwise;
      # E2E_OUT_DIR and E2E_SKIP_BUILD point `vite preview` at the dist above, a
      # build made with the same config and the same environment.
      # The export journeys check the downloaded files with ffprobe and ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke journeys
        id: smoke
        env:
          E2E_OUT_DIR: dist
          E2E_SKIP_BUILD: "1"
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm e2e:smoke

      - name: Upload traces and videos
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ github.run_attempt }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 14

  # The hosted journeys, on the pull requests that can break them (#302: #279
  # merged green and the break went unseen for hours). Not a required check:
  # the ruleset requires "Quality gate" only. The journeys' own check is named
  # "Hosted journeys / Hosted journeys" when it runs and plain "Hosted journeys"
  # when it is skipped, so requiring either name would leave every pull request
  # that skips it waiting forever. The "Hosted gate" job that made a requirable
  # name out of it is gone (#340: three more billed minutes on every push for a
  # check nobody requires); it comes back the day #302 requires it.
  #
  # `needs: quality-gate` is the saving: a red gate never spends the 13 minutes.
  hosted-e2e:
    name: Hosted journeys
    needs: quality-gate
    if: needs.quality-gate.outputs.hosted == 'true'
    uses: ./.github/workflows/hosted-e2e.yml

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisories are reported but never block a merge: a fresh CVE in a
      # transitive dependency is not a reason to freeze an unrelated PR.
      - name: Audit
        run: pnpm audit --audit-level moderate || true
