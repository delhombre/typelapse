name: Deploy staging

# Manual only: build one image, push it to GHCR, then on the craft-prod cluster
# run the release Job (migrate + hosted:check), roll the API, smoke both worker
# CronJobs and resume them. Dispatch it against the ref you want to see running;
# the image is tagged with that ref's commit SHA.
#
# Secrets and variables live in the GitHub Environment `staging`, never in the
# repo. See infra/kubernetes/README.md for the full list and .env.staging.example
# for what each one is. Third-party actions are pinned by commit SHA, with the
# version they were resolved from in the trailing comment.

on:
  workflow_dispatch:

concurrency:
  # One staging deploy at a time, and never cancelled mid-rollout.
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: typelapse-staging
  # The only place the hostname is written; production reuses the manifests
  # with typelapse.com.
  APP_HOST: staging.typelapse.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/typelapse
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # While the repository is private its GHCR image is private too, and the
      # cluster can only pull it with GHCR_PULL_TOKEN. Fail before the build
      # rather than after a rollout that cannot start. Once the package is
      # public, set the Environment variable GHCR_PACKAGE_PUBLIC to true.
      - name: Check the image pull credential
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PACKAGE_PUBLIC: ${{ vars.GHCR_PACKAGE_PUBLIC }}
        run: |
          if [ "${GHCR_PACKAGE_PUBLIC:-}" != "true" ] && [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "::error::The Environment secret GHCR_PULL_TOKEN is not set. The image is private while the repository is, and the cluster needs a classic PAT with only read:packages to pull it. Set it, or set the Environment variable GHCR_PACKAGE_PUBLIC to true once the package is public."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VITE_* values and TYPELAPSE_APP_URL (the share-card tags) are baked
      # into the client bundle, so they are build args: one build per
      # environment, tagged with the commit SHA.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TYPELAPSE_DEPLOYMENT_MODE=hosted
            VITE_TYPELAPSE_AUTH_ENABLED=true
            TYPELAPSE_APP_URL=https://${{ env.APP_HOST }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      # Passed through the env rather than interpolated into the script, so the
      # decoded value never lands in the step's shell source on the runner. The
      # file lives in RUNNER_TEMP (mode 600) and is removed by the last step.
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_INFOMANIAK }}
        run: |
          set -euo pipefail
          umask 077
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          # The decoded file holds the deployer's credentials, which GitHub does
          # not know to mask because only the base64 form is a secret. Ask
          # kubectl for the values rather than grepping a file whose layout
          # (YAML or JSON, quoted keys) is not ours.
          export KUBECONFIG="$kubeconfig"
          kubectl config view --raw \
            -o jsonpath='{range .users[*]}{.user.token}{"\n"}{.user.client-key-data}{"\n"}{end}' \
            | while read -r secret; do
                if [ -n "$secret" ]; then
                  echo "::add-mask::$secret"
                fi
              done

      # Fill the placeholders in a copy under RUNNER_TEMP. The values are
      # identifiers (hostnames, IDs), checked against a strict pattern so
      # nothing can break out of the sed expression.
      - name: Render manifests
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          POLAR_CREATOR_MONTHLY_PRODUCT_ID: ${{ vars.POLAR_CREATOR_MONTHLY_PRODUCT_ID }}
          POLAR_CREATOR_ANNUAL_PRODUCT_ID: ${{ vars.POLAR_CREATOR_ANNUAL_PRODUCT_ID }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_BUCKET POLAR_CREATOR_MONTHLY_PRODUCT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The Environment variable $name is not set"
              exit 1
            fi
          done
          # POLAR_CREATOR_ANNUAL_PRODUCT_ID is optional and may be empty.
          for name in APP_HOST IMAGE_TAG DEPLOY_RUN R2_ACCOUNT_ID R2_BUCKET POLAR_CREATOR_MONTHLY_PRODUCT_ID POLAR_CREATOR_ANNUAL_PRODUCT_ID; do
            if ! printf '%s' "${!name:-}" | grep -Eq '^[A-Za-z0-9._-]*$'; then
              echo "::error::$name contains characters outside [A-Za-z0-9._-]"
              exit 1
            fi
          done
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          for file in infra/kubernetes/staging/*.yaml; do
            sed \
              -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
              -e "s|__APP_HOST__|${APP_HOST}|g" \
              -e "s|__DEPLOY_RUN__|${DEPLOY_RUN}|g" \
              -e "s|__R2_ACCOUNT_ID__|${R2_ACCOUNT_ID}|g" \
              -e "s|__R2_BUCKET__|${R2_BUCKET}|g" \
              -e "s|__POLAR_CREATOR_MONTHLY_PRODUCT_ID__|${POLAR_CREATOR_MONTHLY_PRODUCT_ID}|g" \
              -e "s|__POLAR_CREATOR_ANNUAL_PRODUCT_ID__|${POLAR_CREATOR_ANNUAL_PRODUCT_ID}|g" \
              "$file" > "$out/$(basename "$file")"
          done
          if grep -nE '__[A-Z0-9_]+__' "$out"/*.yaml; then
            echo "::error::A placeholder was left unreplaced"
            exit 1
          fi

      # The Secret is built from an env file that exists only in RUNNER_TEMP
      # (mode 600, removed on exit) and goes straight into kubectl's stdin.
      # Nothing is echoed, and the values are already masked by GitHub.
      - name: Write Secret and pull secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          TYPELAPSE_GITHUB_TOKEN: ${{ secrets.TYPELAPSE_GITHUB_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          umask 077
          envfile="$(mktemp -p "$RUNNER_TEMP")"
          trap 'rm -f "$envfile"' EXIT
          for name in DATABASE_URL BETTER_AUTH_SECRET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY POLAR_ACCESS_TOKEN POLAR_WEBHOOK_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The Environment secret $name is not set"
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$envfile"
          done
          if [ -n "${TYPELAPSE_GITHUB_TOKEN:-}" ]; then
            printf '%s=%s\n' TYPELAPSE_GITHUB_TOKEN "$TYPELAPSE_GITHUB_TOKEN" >> "$envfile"
          fi
          # Server-side apply keeps the values out of the last-applied-
          # configuration annotation; --force-conflicts takes the fields back
          # from any other manager (a hand-made `kubectl create secret`).
          kubectl -n "$NAMESPACE" create secret generic typelapse-env \
            --from-env-file="$envfile" --dry-run=client -o yaml \
            | kubectl apply --server-side --force-conflicts -f -
          # Absent only when the package is public (GHCR_PACKAGE_PUBLIC=true).
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            kubectl -n "$NAMESPACE" create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io --docker-username="$GHCR_PULL_USER" \
              --docker-password="$GHCR_PULL_TOKEN" --dry-run=client -o yaml \
              | kubectl apply --server-side --force-conflicts -f -
          fi

      - name: Apply ConfigMap
        run: kubectl apply -f "$RUNNER_TEMP/rendered/configmap.yaml"

      # Both workers are CronJobs that drain the queue and exit. Suspend them so
      # no new pod starts during the release, then wait for the Jobs already
      # created to finish. They stay suspended if anything after this fails; the
      # "Resume the workers" step is the only thing that unsuspends them. Absent
      # on the first deploy, so each patch is skipped then.
      - name: Suspend the workers for the release
        run: |
          set -euo pipefail
          for cronjob in typelapse-render-worker typelapse-deletion-worker; do
            if kubectl -n "$NAMESPACE" get "cronjob/$cronjob" > /dev/null 2>&1; then
              kubectl -n "$NAMESPACE" patch "cronjob/$cronjob" --type merge -p '{"spec":{"suspend":true}}'
            fi
          done
          # A worker Job is still unfinished while it has no completionTime and
          # no Failed condition. Testing status.active alone would miss a Job
          # the CronJob created an instant before the patch, whose pod does not
          # exist yet. A render may legitimately run for a while
          # (TYPELAPSE_RENDER_TIMEOUT_MS is 15 minutes by default), so the wait
          # is bounded at 20.
          deadline=$((SECONDS + 1200))
          unfinished=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            unfinished="$(kubectl -n "$NAMESPACE" get jobs \
              -l 'app in (typelapse-render-worker,typelapse-deletion-worker)' -o json \
              | jq -r '.items[]
                  | select((.status.completionTime // "") == "")
                  | select([.status.conditions[]? | select(.type == "Failed" and .status == "True")] | length == 0)
                  | .metadata.name')"
            if [ -z "$unfinished" ]; then
              echo "No worker Job is running"
              exit 0
            fi
            echo "Waiting for: $unfinished"
            sleep 10
          done
          echo "::error::A worker Job was still running after 20 minutes ($unfinished). The workers are suspended; re-run the deploy once it has finished."
          exit 1

      # A Job's pod template is immutable, so the previous one goes first.
      - name: Run release Job
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job typelapse-release --ignore-not-found --wait=true
          kubectl apply -f "$RUNNER_TEMP/rendered/release-job.yaml"
          diagnose() {
            echo "::error::$1"
            kubectl -n "$NAMESPACE" describe job typelapse-release || true
            kubectl -n "$NAMESPACE" get pods -l job-name=typelapse-release || true
            kubectl -n "$NAMESPACE" describe pods -l job-name=typelapse-release || true
            echo "Last 30 events:"
            kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 30 || true
            kubectl -n "$NAMESPACE" logs job/typelapse-release --all-containers --tail=200 || true
          }
          # `kubectl wait` only knows one condition, so a failed Job would sit
          # out the whole timeout. Poll the counters, and the pod's waiting
          # reason so a bad image fails in seconds, not after the timeout.
          deadline=$((SECONDS + 660))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(kubectl -n "$NAMESPACE" get job typelapse-release -o jsonpath='{.status.succeeded}/{.status.failed}')"
            case "$status" in
              1/*) echo "Release Job succeeded"; exit 0 ;;
              */[1-9]*) diagnose "Release Job failed"; exit 1 ;;
            esac
            waiting="$(kubectl -n "$NAMESPACE" get pods -l job-name=typelapse-release \
              -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}')"
            case "$waiting" in
              *ErrImagePull*|*ImagePullBackOff*|*InvalidImageName*)
                diagnose "Release Job cannot pull its image ($waiting). Check GHCR_PULL_TOKEN and that the build pushed this tag."
                exit 1 ;;
            esac
            # The Job controller could not create the pod at all: quota or
            # admission refused it.
            refused="$(kubectl -n "$NAMESPACE" get events \
              --field-selector involvedObject.kind=Job,involvedObject.name=typelapse-release,reason=FailedCreate \
              -o jsonpath='{.items[*].message}')"
            if [ -n "$refused" ]; then
              diagnose "The release pod was refused: $refused"
              exit 1
            fi
            sleep 5
          done
          diagnose "Release Job did not finish in 11 minutes"
          exit 1

      # The CronJobs are applied suspended (suspend: true in the manifests).
      - name: Apply API, CronJobs and Ingress
        run: |
          set -euo pipefail
          for file in api render-worker deletion-worker ingress; do
            kubectl apply -f "$RUNNER_TEMP/rendered/$file.yaml"
          done

      # Timeout sized for the managed cluster's small (2 vCPU / 4 GB) nodes: an
      # image pull plus a cold start is slow there.
      - name: Wait for the API rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/typelapse-api --timeout=420s

      # Run each worker once, by hand, from its (still suspended) CronJob, to
      # prove the pod starts and exits cleanly: image, secret, database URL,
      # PriorityClass and quota. On an empty queue drain mode exits 0 in
      # seconds. A queued job is worked for real, so the bound (1000 s) sits
      # above the render timeout (TYPELAPSE_RENDER_TIMEOUT_MS, 900 s). A Job
      # still running at the bound is NOT deleted: it may be a real render. The
      # next deploy waits for it before it migrates, and the Job's own
      # activeDeadlineSeconds ends it.
      - name: Smoke the workers
        run: |
          set -euo pipefail
          run="${{ github.run_id }}-${{ github.run_attempt }}"
          jobs=()
          # Delete only Jobs that have finished, whatever the outcome.
          cleanup() {
            for job in "${jobs[@]}"; do
              status="$(kubectl -n "$NAMESPACE" get job "$job" -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null || true)"
              case "$status" in
                1/*|*/[1-9]*) kubectl -n "$NAMESPACE" delete job "$job" --ignore-not-found --wait=false || true ;;
                *) echo "Leaving $job in place: it has not finished." ;;
              esac
            done
          }
          trap cleanup EXIT
          report() {
            echo "::error::$1"
            kubectl -n "$NAMESPACE" describe job "$2" || true
            kubectl -n "$NAMESPACE" describe pods -l "job-name=$2" || true
            kubectl -n "$NAMESPACE" logs "job/$2" --all-containers --tail=200 || true
          }
          for cronjob in typelapse-render-worker typelapse-deletion-worker; do
            job="smoke-${cronjob#typelapse-}-$run"
            kubectl -n "$NAMESPACE" create job "$job" --from="cronjob/$cronjob"
            jobs+=("$job")
          done
          deadline=$((SECONDS + 1000))
          pending=("${jobs[@]}")
          while [ "$SECONDS" -lt "$deadline" ] && [ "${#pending[@]}" -gt 0 ]; do
            still=()
            for job in "${pending[@]}"; do
              status="$(kubectl -n "$NAMESPACE" get job "$job" -o jsonpath='{.status.succeeded}/{.status.failed}')"
              case "$status" in
                1/*) echo "$job completed"; continue ;;
                */[1-9]*) report "$job failed" "$job"; exit 1 ;;
              esac
              waiting="$(kubectl -n "$NAMESPACE" get pods -l "job-name=$job" \
                -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}')"
              case "$waiting" in
                *ErrImagePull*|*ImagePullBackOff*|*InvalidImageName*)
                  report "$job cannot pull its image ($waiting)" "$job"; exit 1 ;;
              esac
              refused="$(kubectl -n "$NAMESPACE" get events \
                --field-selector "involvedObject.kind=Job,involvedObject.name=$job,reason=FailedCreate" \
                -o jsonpath='{.items[*].message}')"
              if [ -n "$refused" ]; then
                report "$job was refused: $refused" "$job"
                exit 1
              fi
              still+=("$job")
            done
            pending=("${still[@]}")
            sleep 5
          done
          if [ "${#pending[@]}" -gt 0 ]; then
            for job in "${pending[@]}"; do
              report "$job did not finish in 1000 s; it is left running in case it is a real render" "$job"
            done
            exit 1
          fi

      - name: Resume the workers
        run: |
          set -euo pipefail
          for cronjob in typelapse-render-worker typelapse-deletion-worker; do
            kubectl -n "$NAMESPACE" patch "cronjob/$cronjob" --type merge -p '{"spec":{"suspend":false}}'
          done

      - name: Show state after a failed deploy
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods,cronjob,jobs -o wide || true
          echo "::group::typelapse-api"
          kubectl -n "$NAMESPACE" logs deployment/typelapse-api --tail=100 || true
          echo "::endgroup::"

      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
