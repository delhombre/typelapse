name: Deploy staging

# Manual only: build one image, push it to GHCR, then on the craft-prod cluster
# run the release Job (migrate + hosted:check), roll the API, smoke both worker
# CronJobs and resume them. Dispatch it against the ref you want to see running;
# the image is tagged with that ref's commit SHA.
#
# Every step that talks to the cluster is a subcommand of
# scripts/deploy/staging.sh, whose kube() retries connection errors (#286) and
# which tests/scripts/deploy-staging.test.ts runs against a stubbed kubectl.
#
# Secrets and variables live in the GitHub Environment `staging`, never in the
# repo. See infra/kubernetes/README.md for the full list and .env.staging.example
# for what each one is. Third-party actions are pinned by commit SHA, with the
# version they were resolved from in the trailing comment.

on:
  workflow_dispatch:

concurrency:
  # One staging deploy at a time, and never cancelled mid-rollout.
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: typelapse-staging
  # The only place the hostname is written; production reuses the manifests
  # with typelapse.com.
  APP_HOST: staging.typelapse.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/typelapse
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # While the repository is private its GHCR image is private too, and the
      # cluster can only pull it with GHCR_PULL_TOKEN. Fail before the build
      # rather than after a rollout that cannot start. Once the package is
      # public, set the Environment variable GHCR_PACKAGE_PUBLIC to true.
      - name: Check the image pull credential
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PACKAGE_PUBLIC: ${{ vars.GHCR_PACKAGE_PUBLIC }}
        run: |
          if [ "${GHCR_PACKAGE_PUBLIC:-}" != "true" ] && [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "::error::The Environment secret GHCR_PULL_TOKEN is not set. The image is private while the repository is, and the cluster needs a classic PAT with only read:packages to pull it. Set it, or set the Environment variable GHCR_PACKAGE_PUBLIC to true once the package is public."
            exit 1
          fi

      # Signing in is a code sent by mail: without SMTP the API mounts no auth and
      # the release Job's hosted:check fails. Say so before a 20-minute build.
      - name: Check the mail server
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
        run: |
          if [ -z "${SMTP_URL:-}" ]; then
            echo "::error::The Environment secret SMTP_URL is not set. Sign-in codes leave by mail: set it to the provider's relay, smtps://user:password@host:465 (Resend: smtps://resend:<API key>@smtp.resend.com:465)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VITE_* values and TYPELAPSE_APP_URL (the share-card tags) are baked
      # into the client bundle, so they are build args: one build per
      # environment, tagged with the commit SHA.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TYPELAPSE_DEPLOYMENT_MODE=hosted
            VITE_TYPELAPSE_AUTH_ENABLED=true
            TYPELAPSE_APP_URL=https://${{ env.APP_HOST }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      # Passed through the env rather than interpolated into the script, so the
      # decoded value never lands in the step's shell source on the runner. The
      # file lives in RUNNER_TEMP (mode 600) and is removed by the last step.
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_INFOMANIAK }}
        run: |
          set -euo pipefail
          umask 077
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          # The decoded file holds the deployer's credentials, which GitHub does
          # not know to mask because only the base64 form is a secret. Ask
          # kubectl for the values rather than grepping a file whose layout
          # (YAML or JSON, quoted keys) is not ours.
          export KUBECONFIG="$kubeconfig"
          kubectl config view --raw \
            -o jsonpath='{range .users[*]}{.user.token}{"\n"}{.user.client-key-data}{"\n"}{end}' \
            | while read -r secret; do
                if [ -n "$secret" ]; then
                  echo "::add-mask::$secret"
                fi
              done

      # Fill the placeholders in a copy under RUNNER_TEMP. The values are
      # identifiers (hostnames, IDs), checked against a strict pattern so
      # nothing can break out of the sed expression.
      - name: Render manifests
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          POLAR_CREATOR_MONTHLY_PRODUCT_ID: ${{ vars.POLAR_CREATOR_MONTHLY_PRODUCT_ID }}
          POLAR_CREATOR_ANNUAL_PRODUCT_ID: ${{ vars.POLAR_CREATOR_ANNUAL_PRODUCT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The sender holds spaces and angle brackets, so it has its own pattern; it
          # still allows nothing that could end the sed expression or the YAML string.
          MAIL_FROM="${MAIL_FROM:-Typelapse <code@typelapse.com>}"
          if ! printf '%s' "$MAIL_FROM" | grep -Eq '^[A-Za-z0-9._+@ <>-]+$'; then
            echo "::error::MAIL_FROM contains characters outside [A-Za-z0-9._+@ <>-]"
            exit 1
          fi
          for name in R2_ACCOUNT_ID R2_BUCKET POLAR_CREATOR_MONTHLY_PRODUCT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The Environment variable $name is not set"
              exit 1
            fi
          done
          # POLAR_CREATOR_ANNUAL_PRODUCT_ID is optional and may be empty.
          for name in APP_HOST IMAGE_TAG DEPLOY_RUN R2_ACCOUNT_ID R2_BUCKET POLAR_CREATOR_MONTHLY_PRODUCT_ID POLAR_CREATOR_ANNUAL_PRODUCT_ID; do
            if ! printf '%s' "${!name:-}" | grep -Eq '^[A-Za-z0-9._-]*$'; then
              echo "::error::$name contains characters outside [A-Za-z0-9._-]"
              exit 1
            fi
          done
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          for file in infra/kubernetes/staging/*.yaml; do
            sed \
              -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
              -e "s|__APP_HOST__|${APP_HOST}|g" \
              -e "s|__DEPLOY_RUN__|${DEPLOY_RUN}|g" \
              -e "s|__R2_ACCOUNT_ID__|${R2_ACCOUNT_ID}|g" \
              -e "s|__R2_BUCKET__|${R2_BUCKET}|g" \
              -e "s|__POLAR_CREATOR_MONTHLY_PRODUCT_ID__|${POLAR_CREATOR_MONTHLY_PRODUCT_ID}|g" \
              -e "s|__POLAR_CREATOR_ANNUAL_PRODUCT_ID__|${POLAR_CREATOR_ANNUAL_PRODUCT_ID}|g" \
              -e "s|__MAIL_FROM__|${MAIL_FROM}|g" \
              "$file" > "$out/$(basename "$file")"
          done
          if grep -nE '__[A-Z0-9_]+__' "$out"/*.yaml; then
            echo "::error::A placeholder was left unreplaced"
            exit 1
          fi

      # The Secret is built from an env file that exists only in RUNNER_TEMP
      # (mode 600, removed on exit) and goes straight into kubectl's stdin.
      # Nothing is echoed, and the values are already masked by GitHub.
      - name: Write Secret and pull secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          TYPELAPSE_GITHUB_TOKEN: ${{ secrets.TYPELAPSE_GITHUB_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ github.repository_owner }}
        run: bash scripts/deploy/staging.sh apply-secrets

      - name: Apply ConfigMap
        run: bash scripts/deploy/staging.sh apply-configmap

      # Both workers are CronJobs that drain the queue and exit. Suspend them so
      # no new pod starts during the release, then wait for the Jobs already
      # created to finish. They stay suspended if anything after this fails; the
      # "Resume the workers" step is the only thing that unsuspends them. Absent
      # on the first deploy, so each patch is skipped then.
      - name: Suspend the workers for the release
        run: bash scripts/deploy/staging.sh suspend-workers

      # A Job's pod template is immutable, so the previous one goes first.
      - name: Run release Job
        run: bash scripts/deploy/staging.sh release-job

      # The CronJobs are applied suspended (suspend: true in the manifests).
      - name: Apply API, CronJobs and Ingress
        run: bash scripts/deploy/staging.sh apply-workloads

      # Timeout sized for the managed cluster's small (2 vCPU / 4 GB) nodes: an
      # image pull plus a cold start is slow there.
      - name: Wait for the API rollout
        run: bash scripts/deploy/staging.sh rollout

      # Run each worker once, by hand, from its (still suspended) CronJob, to
      # prove the pod starts and exits cleanly. The details are in the script.
      - name: Smoke the workers
        run: bash scripts/deploy/staging.sh smoke

      - name: Resume the workers
        run: bash scripts/deploy/staging.sh resume-workers

      - name: Show state after a failed deploy
        if: failure()
        run: bash scripts/deploy/staging.sh show-state

      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
