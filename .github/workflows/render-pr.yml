# The action at the repository root, run on this repository's own pull
# requests: the demo of what it posts.
name: Render PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A new push replaces the render in flight; the comment is edited, not added.
concurrency:
  group: render-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A demo, not a gate: a pull request GitHub cannot serve as a diff (this
    # repository's own large ones) still gets its comment, and never blocks a
    # merge. The action itself keeps failing the job for the people who use it.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          # Set the repository variable once a studio is deployed; empty links a local one.
          studio-url: ${{ vars.TYPELAPSE_STUDIO_URL }}
