# The net under main, every night and on demand (#340). ci.yml has no `push`
# trigger on main, so nothing else runs the code once it is merged:
#   - `gate`: lint, both typechecks and the unit tests on main, the part of the
#     Quality gate a merge of two green pull requests on different bases can break;
#   - `e2e`: every journey (the smoke subset runs on each pull request, ci.yml),
#     including the ones that reach GitHub;
#   - `hosted`: the hosted journeys (hosted-e2e.yml) against PostgreSQL, MinIO,
#     maildev and the real render worker.
name: E2E nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  gate:
    name: Main gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck client
        run: pnpm check-types

      - name: Typecheck server
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test

  e2e:
    name: All journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Journeys
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # The real pull request journey authenticates its GitHub API calls
          # with it; anonymous calls share 60 an hour with the whole runner.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm e2e

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-${{ github.run_id }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 14

  # The same job a pull request runs when it touches the hosted side (ci.yml),
  # here without a path filter: the net for everything the filter does not name.
  hosted:
    name: Hosted journeys
    uses: ./.github/workflows/hosted-e2e.yml
