# .lapse holds a local-only, licence-gated dev tool. Without this exclusion
# pnpm treats it as a workspace member and writes its dependency into the
# root lockfile, which then makes CI try to fetch a package it cannot auth for.
packages:
  - '!.lapse'

allowBuilds:
  '@biomejs/biome': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@esbuild/aix-ppc64@0.28.2'
  - '@esbuild/android-arm64@0.28.2'
  - '@esbuild/android-arm@0.28.2'
  - '@esbuild/android-x64@0.28.2'
  - '@esbuild/darwin-arm64@0.28.2'
  - '@esbuild/darwin-x64@0.28.2'
  - '@esbuild/freebsd-arm64@0.28.2'
  - '@esbuild/freebsd-x64@0.28.2'
  - '@esbuild/linux-arm64@0.28.2'
  - '@esbuild/linux-arm@0.28.2'
  - '@esbuild/linux-ia32@0.28.2'
  - '@esbuild/linux-loong64@0.28.2'
  - '@esbuild/linux-mips64el@0.28.2'
  - '@esbuild/linux-ppc64@0.28.2'
  - '@esbuild/linux-riscv64@0.28.2'
  - '@esbuild/linux-s390x@0.28.2'
  - '@esbuild/linux-x64@0.28.2'
  - '@esbuild/netbsd-arm64@0.28.2'
  - '@esbuild/netbsd-x64@0.28.2'
  - '@esbuild/openbsd-arm64@0.28.2'
  - '@esbuild/openbsd-x64@0.28.2'
  - '@esbuild/openharmony-arm64@0.28.2'
  - '@esbuild/sunos-x64@0.28.2'
  - '@esbuild/win32-arm64@0.28.2'
  - '@esbuild/win32-ia32@0.28.2'
  - '@esbuild/win32-x64@0.28.2'
  - esbuild@0.28.2
  - '@e2e-dev/web@0.13.0'
  - e2e@0.18.0

# Transitive dependencies pinned past a published advisory. Each entry exists
# because a direct dependency still resolves a vulnerable range; drop the entry
# once that dependency ships a fixed range on its own.
overrides:
  dompurify: ^3.4.16 # via monaco-editor
  ws: ^8.21.3
  postcss: ^8.5.26
  picomatch: ^4.0.5
  esbuild@>=0.27.0: ^0.28.2
  esbuild@<0.24.3: ^0.25.12 # via drizzle-kit > @esbuild-kit/esm-loader
  fast-uri: ^3.1.8 # via remotion > webpack > schema-utils > ajv
  '@babel/core': ^7.29.1 # via @vitejs/plugin-react, build-time only
  browserslist: ^4.28.7 # via @babel/core and remotion > webpack
  baseline-browser-mapping: ^2.11.0 # via browserslist
  js-yaml: ^4.3.2 # via @remotion/cli > @svgr/core > cosmiconfig
  postcss-selector-parser: ^7.1.3 # via @remotion/bundler > css-loader

patchedDependencies:
  vaul@1.1.2: patches/vaul@1.1.2.patch
