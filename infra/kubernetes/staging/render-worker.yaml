apiVersion: apps/v1
kind: Deployment
metadata:
  name: typelapse-render-worker
  namespace: typelapse-staging
spec:
  # One worker, one render at a time: the loop in hosted-render-runtime.ts is
  # sequential and claims a single job per iteration.
  replicas: 1
  # Never two workers at once during a rollout: a surge pod would double the
  # memory this namespace has to find for a Chromium render.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: typelapse-render-worker
  template:
    metadata:
      labels:
        app: typelapse-render-worker
      annotations:
        typelapse.dev/deploy-run: "__DEPLOY_RUN__"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # SIGTERM aborts the render in flight (hosted-render.entrypoint.ts): the
      # processor stops the renderer, deletes the temp files and any half-stored
      # output, then the loop returns. The lease is NOT released on the way out;
      # the job is claimed again once its lease (TYPELAPSE_RENDER_LEASE_MS,
      # 120 s by default) expires. 60 s is for that cleanup, not for waiting out
      # a render.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: render-worker
          image: ghcr.io/delhombre/typelapse:__IMAGE_TAG__
          command: ["node_modules/.bin/tsx", "server/workers/hosted-render.entrypoint.ts"]
          envFrom:
            - configMapRef:
                name: typelapse-config
            - secretRef:
                name: typelapse-env
          env:
            # The pod name is unique and matches the id pattern the worker checks.
            - name: TYPELAPSE_RENDER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TYPELAPSE_RENDER_TEMP_ROOT
              value: /render-tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # WAITING FOR A MEASUREMENT. The two memory values are the peak RSS of
          # a real 1080p render plus headroom. The workflow reads them from the
          # GitHub Environment variables RENDER_MEMORY_REQUEST and
          # RENDER_MEMORY_LIMIT and refuses to deploy without them. A node has
          # 4 GB, so the limit must leave room for the API and the node's own
          # pods. The CPU figures are guesses too: Chromium encodes on every
          # core it is given.
          resources:
            requests:
              memory: "__RENDER_MEMORY_REQUEST__"
              cpu: "500m"
            limits:
              memory: "__RENDER_MEMORY_LIMIT__"
              cpu: "1500m"
          # No probe: the worker serves no port. Kubernetes restarts it if the
          # process exits, and the entrypoint exits non-zero on a fatal error.
          volumeMounts:
            - name: render-tmp
              mountPath: /render-tmp
            # Chromium keeps shared memory in /dev/shm; the container default
            # of 64 MiB crashes tabs on a real render.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: render-tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: dshm
          emptyDir:
            medium: Memory
            # Memory-backed, so it counts against the container's memory limit
            # once used.
            sizeLimit: 512Mi
