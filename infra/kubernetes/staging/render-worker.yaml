# On-demand hosted render worker. A pod exists only while there is work: every
# minute the CronJob starts one, it drains the queue
# (TYPELAPSE_WORKER_EXIT_WHEN_IDLE) and exits, so an empty queue costs seconds.
# Forbid means never two at once. The workflow suspends and resumes this
# CronJob around the release Job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: typelapse-render-worker
  namespace: typelapse-staging
spec:
  # Applied suspended: only the workflow's "Resume the workers" step, after the
  # release Job, the API rollout and the smoke run, sets this to false.
  suspend: true
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  # A missed tick (cluster busy, controller down) is dropped after two minutes
  # rather than started late.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: typelapse-render-worker
    spec:
      # No retry: the queue already retries a failed job with its own attempts
      # and backoff, and the next tick starts a fresh pod.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: typelapse-render-worker
          annotations:
            typelapse.dev/deploy-run: "__DEPLOY_RUN__"
        spec:
          restartPolicy: Never
          # Created by the infra repo (infra-infomaniak), not here: a low
          # priority, so the render pod is the first evicted under node pressure.
          priorityClassName: typelapse-render-low
          imagePullSecrets:
            - name: ghcr-secret
          # SIGTERM aborts the render in flight (hosted-render.entrypoint.ts):
          # the processor stops the renderer, deletes the temp files and any
          # half-stored output, then the loop returns. The lease is NOT released
          # on the way out; the job is claimed again once its lease
          # (TYPELAPSE_RENDER_LEASE_MS, 120 s by default) expires. 60 s is for
          # that cleanup, not for waiting out a render.
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: render-worker
              image: ghcr.io/delhombre/typelapse:__IMAGE_TAG__
              # args only: the image's ENTRYPOINT is tini, which forwards SIGTERM.
              args: ["node_modules/.bin/tsx", "server/workers/hosted-render.entrypoint.ts"]
              envFrom:
                - configMapRef:
                    name: typelapse-config
                - secretRef:
                    name: typelapse-env
              env:
                # The pod name is unique and matches the id pattern the worker checks.
                - name: TYPELAPSE_RENDER_WORKER_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              # Measured on a 20 s, 1080p, 30 fps render at concurrency 1: cgroup
              # peak 1.72 to 1.81 GB, so the limit is 2Gi (docs/launch/deploy.md).
              # The request is fixed at 1Gi (decision D8), which
              # keeps API + render + deletion pods inside the namespace's
              # 1536Mi requests quota.
              # The CPU figures are guesses: Chromium encodes on every core it gets.
              # The root file system stays writable: tsx and Chromium write to
              # /tmp and webpack to /app/node_modules/.cache, and only the render
              # scratch space is worth bounding (the volume below).
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
              # No probe: the worker serves no port, and the Job fails if the
              # process exits non-zero.
              volumeMounts:
                # TYPELAPSE_RENDER_TEMP_ROOT, set by the image: one directory per
                # job. No /dev/shm volume: Remotion starts Chromium with
                # --disable-dev-shm-usage and --no-sandbox.
                - name: render-tmp
                  mountPath: /var/lib/typelapse/render
          volumes:
            - name: render-tmp
              emptyDir:
                sizeLimit: 4Gi
