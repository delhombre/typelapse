apiVersion: apps/v1
kind: Deployment
metadata:
  name: typelapse-render-worker
  namespace: typelapse-staging
spec:
  # One worker, one render at a time: the loop in hosted-render-runtime.ts is
  # sequential and claims a single job per iteration.
  replicas: 1
  # Never two render pods at once during a rollout: the namespace quota
  # (requests.memory 1Gi, limits.memory 3Gi once infra raises it, requests.cpu 750m, limits.cpu 2)
  # has no room for a surge pod, let alone a second Chromium.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: typelapse-render-worker
  template:
    metadata:
      labels:
        app: typelapse-render-worker
      annotations:
        typelapse.dev/deploy-run: "__DEPLOY_RUN__"
    spec:
      # Created by the infra repo (infra-infomaniak), not here: a low priority,
      # so the render worker is the first pod evicted under node pressure.
      priorityClassName: typelapse-render-low
      imagePullSecrets:
        - name: ghcr-secret
      # SIGTERM aborts the render in flight (hosted-render.entrypoint.ts): the
      # processor stops the renderer, deletes the temp files and any half-stored
      # output, then the loop returns. The lease is NOT released on the way out;
      # the job is claimed again once its lease (TYPELAPSE_RENDER_LEASE_MS,
      # 120 s by default) expires. 60 s is for that cleanup, not for waiting out
      # a render.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: render-worker
          image: ghcr.io/delhombre/typelapse:__IMAGE_TAG__
          # args only: the image's ENTRYPOINT is tini, which forwards SIGTERM.
          args: ["node_modules/.bin/tsx", "server/workers/hosted-render.entrypoint.ts"]
          envFrom:
            - configMapRef:
                name: typelapse-config
            - secretRef:
                name: typelapse-env
          env:
            # The pod name is unique and matches the id pattern the worker checks.
            - name: TYPELAPSE_RENDER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Measured on a 20 s, 1080p, 30 fps render at concurrency 1: cgroup
          # peak 1.72 to 1.81 GB, so the limit is 2Gi (docs/launch/deploy.md).
          # The request is still a placeholder: the workflow reads it from the
          # GitHub Environment variable RENDER_MEMORY_REQUEST and refuses to
          # deploy without it. The namespace requests quota caps it at 736Mi.
          # The CPU figures are guesses: Chromium encodes on every core it gets.
          # The root file system stays writable: tsx and Chromium write to /tmp
          # and webpack to /app/node_modules/.cache, and only the render
          # scratch space is worth bounding (the volume below).
          resources:
            requests:
              memory: "__RENDER_MEMORY_REQUEST__"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # No probe: the worker serves no port. Kubernetes restarts it if the
          # process exits, and the entrypoint exits non-zero on a fatal error.
          volumeMounts:
            # TYPELAPSE_RENDER_TEMP_ROOT, set by the image: one directory per
            # job. No /dev/shm volume: Remotion starts Chromium with
            # --disable-dev-shm-usage and --no-sandbox.
            - name: render-tmp
              mountPath: /var/lib/typelapse/render
      volumes:
        - name: render-tmp
          emptyDir:
            sizeLimit: 4Gi
