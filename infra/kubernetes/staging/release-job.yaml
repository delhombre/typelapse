# Runs after the workflow has suspended both worker CronJobs and waited for
# their pods to finish, and before the manifests are applied: migrate the schema,
# then check that every hosted capability is configured. A non-zero exit fails the deploy,
# so a half-configured staging never takes traffic. The workflow deletes the
# previous Job first (a Job's pod template is immutable) and leaves this one in
# place afterwards so its logs can be read.
apiVersion: batch/v1
kind: Job
metadata:
  name: typelapse-release
  namespace: typelapse-staging
spec:
  # A failed migration is read by a human, not retried blindly.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: release
          image: ghcr.io/delhombre/typelapse:__IMAGE_TAG__
          # The `db:migrate` and `hosted:check` package scripts, called directly.
          # The image links drizzle-kit into node_modules/.bin after pruning the
          # dev dependencies.
          # args only: the image's ENTRYPOINT is tini.
          args:
            - /bin/sh
            - -c
            - |
              set -e
              node_modules/.bin/drizzle-kit migrate
              node_modules/.bin/tsx server/config/hosted-check.entrypoint.ts
          envFrom:
            - configMapRef:
                name: typelapse-config
            - secretRef:
                name: typelapse-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
